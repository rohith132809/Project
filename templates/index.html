<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Authentication</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Inter,Segoe UI,sans-serif;
    background:radial-gradient(circle at top,#6d5dfc,#3b2ea3);
    perspective:1400px;
}

/* ===== 3D CARD ===== */
.card{
    width:540px;
    padding:38px;
    border-radius:28px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(18px);
    box-shadow:0 40px 80px rgba(0,0,0,.5);
    color:white;
    text-align:center;
    transform-style:preserve-3d;
    transition:.15s ease;
}

/* ===== MIC ===== */
.mic{
    width:80px;
    height:80px;
    border-radius:50%;
    margin:0 auto 14px;
    background:#ff4d4d;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    box-shadow:0 0 0 rgba(255,77,77,.7);
    animation:none;
    transform:translateZ(40px);
}
.mic.active{
    animation:pulse 1.2s infinite;
}
@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,77,77,.7)}
    70%{box-shadow:0 0 0 18px rgba(255,77,77,0)}
    100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}
}

/* ===== TEXT ===== */
h2{margin:10px 0 6px;transform:translateZ(30px)}
p{opacity:.85;margin-bottom:22px;transform:translateZ(25px)}

/* ===== INPUT ===== */
.input{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,.2);
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:22px;
    transform:translateZ(20px);
}
.input i{margin-right:10px}
input{
    background:none;border:none;outline:none;
    color:white;width:100%;font-size:15px;
}

/* ===== BUTTONS ===== */
.buttons{
    display:flex;
    gap:14px;
    transform:translateZ(20px);
}
button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:white;
}
.signup{background:#7289da}
.signin{background:#00c853}

/* ===== CONFIDENCE METER ===== */
.meter{
    margin-top:26px;
    display:none;
    transform:translateZ(30px);
}
.bar{
    height:14px;
    width:100%;
    background:rgba(255,255,255,.25);
    border-radius:10px;
    overflow:hidden;
}
.fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff5252,#00e676);
    transition:width 1s ease;
}
.score-text{
    margin-top:8px;
    font-size:14px;
    opacity:.9;
}

/* ===== STATUS ===== */
.status{
    margin-top:16px;
    font-size:14px;
    color:#ffb4b4;
    transform:translateZ(20px);
}
</style>
</head>

<body>

<div class="card" id="card">

    <!-- MIC -->
    <div class="mic" id="mic">
        <i class="fa-solid fa-microphone"></i>
    </div>

    <h2>Voice Authentication</h2>
    <p>Secure login using your voice</p>

    <form method="post" onsubmit="startMic()">
        <div class="input">
            <i class="fa-solid fa-user"></i>
            <input type="text" name="username" placeholder="Enter username" required>
        </div>

        <div class="buttons">
            <button class="signup" name="action" value="signup">
                <i class="fa-solid fa-user-plus"></i> Sign Up
            </button>
            <button class="signin" name="action" value="signin">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </div>
    </form>

    <!-- CONFIDENCE METER -->
    {% if score %}
    <div class="meter" id="meter">
        <div class="bar">
            <div class="fill" id="fill"></div>
        </div>
        <div class="score-text">
            Confidence: {{ "%.2f"|format(score) }}
        </div>
    </div>
    {% endif %}

    {% if status %}
        <div class="status">{{ status }}</div>
    {% endif %}

</div>

<script>
/* 3D tilt */
const card=document.getElementById("card");
document.addEventListener("mousemove",e=>{
    const x=(window.innerWidth/2-e.clientX)/35;
    const y=(window.innerHeight/2-e.clientY)/35;
    card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;
});
document.addEventListener("mouseleave",()=>{
    card.style.transform="rotateY(0deg) rotateX(0deg)";
});

/* Mic animation */
function startMic(){
    document.getElementById("mic").classList.add("active");
}

/* Confidence meter animation */
{% if score %}
const meter=document.getElementById("meter");
const fill=document.getElementById("fill");
meter.style.display="block";
setTimeout(()=>{
    fill.style.width="{{ score*100 }}%";
},200);
{% endif %}
</script>

</body>
</html>
