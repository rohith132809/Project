<!DOCTYPE html>
<html>
<head>
    <title>Voice Authentication</title>
</head>
<body>
    <h2>Voice Authentication System</h2>

    <form method="post">
        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>

        <label>Action:</label><br>
        <input type="radio" name="action" value="signup" required> Signup
        <input type="radio" name="action" value="signin"> Signin
        <br><br>

        <button type="submit">Record Voice & Continue</button>
    </form>

    <p><b>Note:</b> Please speak clearly when recording starts.</p>
</body>
</html>
